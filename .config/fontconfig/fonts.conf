<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Preferred generic families -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Geist</family>
      <family>Google Sans</family>
      <family>Roboto</family>
      <family>Noto Sans</family>
      <family>Noto Sans KR</family>
      <family>Noto Sans JP</family>
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Thai</family>
      <family>Noto Sans TC</family>
      <family>Noto Sans SC</family>
      <family>Noto Sans Symbols</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Playfair Display</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Geist Mono</family>
      <family>Google Sans Code</family>
    </prefer>
  </alias>

  <!-- System UI aliases -->
  <alias>
    <family>system-ui</family>
    <prefer><family>Geist</family></prefer>
  </alias>

  <alias>
    <family>ui-monospace</family>
    <prefer><family>Geist Mono</family></prefer>
  </alias>

  <alias>
    <family>-apple-system</family>
    <prefer><family>Geist</family></prefer>
  </alias>

  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer><family>Geist</family></prefer>
  </alias>

  <!-- Emoji fallback (always last) -->
  <match>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>
  <match>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>
  <match>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <match>
    <test name="family"><string>Apple Color Emoji</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Color Emoji</string></edit>
  </match>

  <!-- Scalability hint for emoji -->
  <match target="scan">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="scalable" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
