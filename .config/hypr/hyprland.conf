monitor = eDP-1,1920x1080@60,0x0,1

exec-once = uwsm app -- easyeffects --gapplication-service
exec-once = uwsm app -- swayosd-server
exec-once = uwsm app -- swww-daemon
exec-once = uwsm app -- walker --gapplication-service

bind = SUPER, W, killactive,
bind = SUPER, E, exec, zeditor
bind = SUPER, RETURN, exec, alacritty
bind = SUPER, SPACE, exec, nc -U /run/user/1000/walker/walker.sock
bind = SUPER, ESCAPE, exec, uwsm stop
bind = SUPER, C, exec, google-chrome-stable
bind = SUPER, B, exec, chromium %U
bind = SUPER, I, exec, chromium --incognito
bind = SUPER, F, exec, nautilus --new-window
bind = SUPER, U, exec, easyeffects
bind = SUPER, P, exec, hyprpicker -a -l
bind = SUPER, PRINT, exec, grim -g "$(slurp)" -t png - | tee "$HOME/screenshots/screenshot_$(date +%s).png" | wl-copy -t image/png
bind = , PRINT, exec, grim -t png - | tee "$HOME/screenshots/screenshot_$(date +%s).png" | wl-copy -t image/png

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER, TAB, workspace, previous
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
bind = SUPER SHIFT, right, movetoworkspace, +1
bind = SUPER SHIFT, left, movetoworkspace, -1
bind = SUPER SHIFT, up, splitratio, +0.05
bind = SUPER SHIFT, down, splitratio, -0.05
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower
binde = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
binde = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = ,XF86AudioMicMute, exec, swayosd-client --output-volume mute-toggle
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

gesture = 3, horizontal, workspace

layerrule = blur, walker
layerrule = blur, swayosd

layerrule = ignorezero, walker
layerrule = ignorezero, swayosd

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

env = HYPRCURSOR_THEME,archypr-cursor
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita-dark
env = XCURSOR_SIZE,24

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
    snap {
        enabled = true
    }
}

decoration {
    blur {
        enabled = true
        size = 12
        passes = 3
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

input {
    follow_mouse = 1
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 1
    font_family = "Geist"
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
    vfr = true
}
