# Fd Flags Reference
# Derived strictly from fd.ts

arguments:
  - name: pattern
    type: string
    required: false
    description: The search pattern (regex by default, or glob if specified).

  - name: path
    type: string
    required: false
    description: The root directory for the search. Defaults to current directory.

  - name: hidden
    type: boolean
    required: false
    description: Include hidden files and directories (-H).

  - name: noIgnore
    type: boolean
    required: false
    description: Show results from files ignored by .gitignore etc. (-I).

  - name: glob
    type: boolean
    required: false
    description: Perform a glob-based search instead of regex (-g).

  - name: fixedStrings
    type: boolean
    required: false
    description: Treat the pattern as a literal string (-F).

  - name: absolutePath
    type: boolean
    required: false
    description: Show absolute paths instead of relative ones (-a).

  - name: maxDepth
    type: number
    required: false
    description: Limit directory traversal depth (-d).

  - name: extension
    type: string[]
    required: false
    description: Filter by file extension(s) (-e).

  - name: fileType
    type: enum
    required: false
    description: Filter by file type (-t).
    options:
      - f
      - file
      - d
      - dir
      - l
      - symlink
      - x
      - executable
      - e
      - empty

  - name: exclude
    type: string[]
    required: false
    description: Exclude files/directories matching glob (-E).

  - name: noIgnoreVcs
    type: boolean
    required: false
    description: Show results ignored by .gitignore (--no-ignore-vcs).

  - name: noRequireGit
    type: boolean
    required: false
    description: Do not require a git repo for gitignore rules (--no-require-git).

  - name: noIgnoreParent
    type: boolean
    required: false
    description: Show results ignored by parent .gitignore (--no-ignore-parent).

  - name: caseSensitive
    type: boolean
    required: false
    description: Perform case-sensitive search (-s).

  - name: ignoreCase
    type: boolean
    required: false
    description: Perform case-insensitive search (-i).

  - name: regex
    type: boolean
    required: false
    description: Use regex search instead of glob (--regex).

  - name: and
    type: string[]
    required: false
    description: Additional required search patterns (--and).

  - name: listDetails
    type: boolean
    required: false
    description: Use detailed listing format (-l).

  - name: ignoreFile
    type: string
    required: false
    description: Add a file of ignore rules (--ignore-file).

  - name: prune
    type: boolean
    required: false
    description: Do not traverse into matching directories (--prune).

  - name: maxResults
    type: number
    required: false
    description: Limit number of search results (--max-results).
