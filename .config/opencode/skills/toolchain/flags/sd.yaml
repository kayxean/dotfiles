# Sd Flags Reference
# Derived strictly from sd.ts

arguments:
  - name: find
    type: string
    required: true
    description: The regexp or string to search for.

  - name: replace
    type: string
    required: true
    description: The replacement string (supports $1, $2 for regex groups).

  - name: files
    type: string[]
    required: true
    description: List of file paths to modify.

  - name: preview
    type: boolean
    required: false
    description: Display changes in a reviewable format instead of applying them (-p).

  - name: fixedStrings
    type: boolean
    required: false
    description: Treat FIND and REPLACE as literal strings (-F).

  - name: flags
    type: string
    required: false
    description: Regex flags (c, i, m, w, etc.).

  - name: across
    type: boolean
    required: false
    description: Process file as a whole instead of line-by-line (-A).

  - name: maxReplacements
    type: number
    required: false
    description: Limit replacements per file (-n).
