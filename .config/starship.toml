"$schema" = 'https://starship.rs/config-schema.json'

format = '$character$directory$git_branch'

[character]
success_symbol = '[󰣇](white)'
error_symbol = '[󰀦](red)'
format = '$symbol '
disabled = false

[directory]
truncation_length = 2
format = '[$path](cyan) '
disabled = false

[git_branch]
format = '[git:\(](blue)[$branch](red)[\)](blue) '
disabled = false

[package]
disabled = true
