theme = "spotlight"

[shell]
anchor_top = true
anchor_bottom = true
anchor_left = true
anchor_right = true

[placeholders]
"default" = { input = "Search", list = "No Results" }
"websearch" = { input = "Search Web", list = "" }

[keybinds]
close = ["Escape"]
next = ["Down", "Right"]
previous = ["Up", "Left"]
quick_activate = []

[providers]
default = ["desktopapplications", "websearch"]
empty = ["desktopapplications"]
max_results = 40

[providers.max_results_provider]
desktopapplications = 40

[[providers.prefixes]]
prefix = "?"
provider = "websearch"

websearch = [{ action = "search", default = true, bind = "enter" }]

desktopapplications = [{ action = "start", default = true, bind = "enter" }]
